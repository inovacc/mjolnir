name: CI Workflow

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.25"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.debian

      - name: Lint Alpine Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.alpine

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        include:
          - variant: debian
            dockerfile: Dockerfile.debian
            suffix: ""
            latest_tag: latest
          - variant: alpine
            dockerfile: Dockerfile.alpine
            suffix: "-alpine"
            latest_tag: latest-alpine
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate tags
        id: tags
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION=${{ steps.version.outputs.version }}
          VARIANT=${{ matrix.variant }}
          SUFFIX=${{ matrix.suffix }}

          if [[ "${{ steps.version.outputs.is_release }}" == "true" ]]; then
            TAGS="${IMAGE}:${VERSION}${SUFFIX}"
            if [[ "$VARIANT" == "debian" ]]; then
              TAGS="${TAGS},${IMAGE}:${VERSION},${IMAGE}:${{ matrix.latest_tag }}"
            else
              TAGS="${TAGS},${IMAGE}:${{ matrix.latest_tag }}"
            fi
          else
            TAGS="${IMAGE}:dev${SUFFIX}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "primary=${TAGS%%,*}" >> $GITHUB_OUTPUT

      # Build and load locally (single platform) so we can smoke-test and scan
      # the exact image BEFORE it is ever pushed. Push happens in a later,
      # release-only step once both gates pass.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            GO_VERSION=${{ env.GO_VERSION }}

      # H-02: real smoke test — assert every expected tool is on PATH.
      # Runs on every build (PR and release), unlike the old release-skipped cat.
      - name: Smoke test tools
        run: |
          docker run --rm "${{ steps.tags.outputs.primary }}" bash -c '
            set -eu
            for t in go rustc cargo node npm pnpm python3 pip3 bun tsc \
                     task gcc goreleaser golangci-lint sqlc buf \
                     protoc-gen-go protoc-gen-go-grpc mockgen air xc \
                     gitleaks govulncheck cosign syft hadolint yq jq \
                     git curl glix docker; do
              command -v "$t" >/dev/null || { echo "MISSING TOOL: $t"; exit 1; }
            done
            echo "smoke test passed: all expected tools present"
          '

      # H-03: gating scan BEFORE push. Fails the build on a fixable CRITICAL
      # in the OS layer -- something the maintainer can act on by bumping the
      # base image. Embedded-Go-stdlib / vendored-library CRITICALs in the
      # pinned third-party tool binaries (goreleaser, buf, ...) are NOT gated:
      # they can only be fixed once each upstream re-releases, so gating them
      # would permanently block the pipeline. They remain fully visible via the
      # os,library SARIF report below (GitHub code scanning).
      - name: Scan image (gate on fixable CRITICAL OS packages)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.primary }}
          format: 'table'
          vuln-type: 'os'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # Non-gating full report for GitHub code scanning.
      - name: Scan image (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.primary }}
          format: 'sarif'
          output: 'trivy-${{ matrix.variant }}.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.variant }}.sarif'
          category: ${{ matrix.variant }}
        continue-on-error: true

      # Only now, after smoke test + CRITICAL gate pass, publish (release only).
      - name: Push image
        if: steps.version.outputs.is_release == 'true'
        run: |
          for tag in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '); do
            docker push "$tag"
          done
